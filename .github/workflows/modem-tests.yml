name: Modem tests

# Format, lint and test the Stage 2 Rust modem (modem/), including the
# bit-exact checks against codes/ and vectors/ and the receiver fixtures.
on:
  push:
    paths:
      - "modem/**"
      - "codes/**"
      - "vectors/**"
      - "docs/SPEC.md"
      - ".github/workflows/modem-tests.yml"
  pull_request:
    paths:
      - "modem/**"
      - "codes/**"
      - "vectors/**"
      - "docs/SPEC.md"
      - ".github/workflows/modem-tests.yml"

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modem
    steps:
      - uses: actions/checkout@v4

      # cpal (cairn-audio) links ALSA. The tests use mock audio and PTT
      # backends only; nothing touches a sound card or serial port here.
      - name: ALSA headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: modem

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      # The native ALSA capture and mixer are a feature (on by default);
      # the build without them must stay clean too.
      - name: Lint without the alsa feature
        run: cargo clippy --all-targets --locked --no-default-features -- -D warnings

      - name: Test
        run: cargo test --locked
