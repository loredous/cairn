name: Publish site

# Implements 0001-record-architecture-decisions/publish-on-main
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-progress deployment; queue the next one instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the changelog is built from full git history

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Implements 0001-record-architecture-decisions/publish-only-valid
      - name: Validate ADRs
        run: uv run --locked scripts/adr.py validate

      - name: Check committed decisions are unchanged
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            uv run --locked scripts/adr.py check-immutable --base "$BEFORE"
          fi

      - name: Build site
        run: uv run --locked scripts/build_site.py --out _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
