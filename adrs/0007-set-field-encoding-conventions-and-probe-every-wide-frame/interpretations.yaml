# yaml-language-server: $schema=../../tools/adrsite/schemas/interpretations.schema.json
#
# Each entry restates or clarifies a decision of this ADR without amending it.

- slug: broadcast-width-detection-method
  decision: broadcast-width-from-probe
  question: >-
    Must a listener find a wide broadcast's width from the probe symbols
    alone, and is that as robust as the prose's "well below the data's
    threshold" suggests?
  interpretation: >-
    The decision fixes what the sender transmits: the probe's extent is the
    frame's width. How a listener detects that extent is not constrained.
    The broadcast-readiness work (2026-11) found probe-only correlation
    reliable only to about 1–1.5 dB below the data's 1% block-error point,
    not well below it. Receivers therefore also use the energy of the data
    symbols on each tone, and on a decode failure retry the widths within 1–3
    tones of the estimate. Any such method meets the decision, provided it
    decodes at the width the probe marks.
  date: 2026-11-07
