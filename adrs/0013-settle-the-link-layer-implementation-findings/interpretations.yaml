# yaml-language-server: $schema=../../tools/adrsite/schemas/interpretations.schema.json
#
# Each entry restates or clarifies a decision of this ADR without amending it.

- slug: step-up-run-conditions
  decision: adaptation-rules-multi-rung
  question: >-
    Must every frame of the three-frame run meet the SNR condition, or only
    the last? And do frames flagged own-ADC-clipped, or measured at
    distortion index 3 or higher, count toward the run?
  interpretation: >-
    Every frame of the run must be clean and measure at least 2 dB above
    the next rung's threshold; a frame with data blocks that misses either
    condition restarts the run, and so does a step up. A frame whose data
    blocks this receiver measured with its ADC clipped, or at distortion
    index 3 or higher, neither steps down nor counts toward a step up, and
    restarts the run: its measurements are unreliable, or the peer is
    expected to change its drive. Frames without data blocks still neither
    count nor break the run. This is how the link-layer implementation
    (PR #22) reads the rule.
  date: 2026-11-07

# --- Findings of the modem run (PR #24), settled with ADR 0014
# (2026-11-08) -----------------------------------------------------------

- slug: lost-header-is-any-failed-header
  decision: adaptation-rules-multi-rung
  question: >-
    The first row of the table speaks of "a preamble detected while awaiting
    the peer, then a header that fails". Does it cover every header that
    fails, whatever the frame type, or only a header of a session frame?
  interpretation: >-
    It covers any header that fails while the station is awaiting the peer,
    whatever frame type it would have described: a header that fails
    cannot be classified. The receiver requests one rung lower, as for
    failed data blocks. A header that fails when no frame is due from the
    peer is not a lost header and does not step down. The runtime of PR #24
    reports `HeaderFailed` for every failed header and the link layer
    applies the rule as stated. It is the same condition under which ADR
    0010 `ack-timer-rules` keeps the ACK timer running (SPEC §9.3, §10.1).
  date: 2026-11-08

- slug: false-dcd-test-conditions
  decision: v1-performance-targets-revised
  question: >-
    Under what noise is the false carrier-detect row (at most 1 per 10
    minutes, squelch open, no signal) measured?
  interpretation: |
    The row is measured in stationary open-squelch noise: the radio's
    squelch open, no signal on the channel, and a noise level that holds
    its mean over each run of at least 10 minutes (a slow drift is
    allowed, a step is not).

    A sudden step in the noise level of 3 dB or more is a separate
    robustness case, reported alongside the row and not part of its
    target: the quieting detector of PR #24 read a drop of that size as a
    carrier about one time in four. The case is reported as a rate per
    step, with the step's direction and size, and no target is set for it
    in v1.0 (SPEC §14.1).
  date: 2026-11-08
