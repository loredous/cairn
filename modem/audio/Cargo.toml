[package]
name = "cairn-audio"
version = "0.1.0"
description = "Cairn real-time audio I/O at 48 kHz: device selection by name, lock-free ring buffers, xrun and gap counters with sample-exact gap filling, real-time thread priority, a mock capture backend, an input level meter and receive-gain mixer control (SPEC 5.1, 7.1, 13.5, 21.3)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["alsa"]
# Native ALSA: the capture stream with its own period and buffer sizes, and
# the capture-gain mixer control for receive AGC. Without it capture goes
# through cpal (two periods of buffer) and there is no mixer control.
alsa = ["dep:alsa"]

[dependencies]
cpal = "0.18"
rtrb = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
alsa = { version = "0.11", optional = true }
