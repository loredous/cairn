[package]
name = "cairn-modem"
version = "0.1.0"
description = "Cairn Stage 2 modem: transmit sequencing, the continuous listener and the cairn-modem command line (SPEC 21.3)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "cairn-modem"
path = "src/main.rs"

[features]
default = ["alsa", "zstd"]
# Native ALSA capture (own period and buffer sizes) and the receive-gain
# mixer control behind `run --rx-agc` (cairn-audio/alsa).
alsa = ["cairn-audio/alsa"]
# PDU compression, encodings 1 and 2 (cairn-link/zstd, SPEC 12.2). Without
# it the modem sends raw, offers no dictionaries and delivers compressed
# bodies undecoded.
zstd = ["cairn-link/zstd"]

[dependencies]
cairn-phy = { path = "../phy" }
cairn-link = { path = "../link", default-features = false, features = ["phy"] }
cairn-audio = { path = "../audio", default-features = false }
cairn-ptt = { path = "../ptt" }
cairn-api = { path = "../api" }
serde_json = "1.0.154"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4"
