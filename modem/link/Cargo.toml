[package]
name = "cairn-link"
version = "0.1.0"
description = "Cairn link layer: sans-IO sessions, selective-repeat ARQ, channel access, adaptation and broadcast (SPEC 8-12, ADRs 0008-0012)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["phy"]
# The adapter between the link layer's frame types and `cairn_phy::fields`.
# The link layer itself never needs the PHY.
phy = ["dep:cairn-phy"]

[dependencies]
cairn-phy = { path = "../phy", optional = true }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
serde_json = "1"
