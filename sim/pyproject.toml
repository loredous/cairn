[project]
name = "cairn-sim"
version = "0.1.0"
description = "Stage 1 simulation of the Cairn waveform, codes and FM channel (SPEC section 21.2)"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cairn_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: long Monte Carlo runs (run with -m slow)"]
